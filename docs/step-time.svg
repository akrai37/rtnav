<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Distribution of control-step durations against the 10 ms budget">
<style>
  svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
        --grid: #e1e0d9; --axis: #c3c2b7; --tape: #c3c2b7; --obstacle: #e1e0d9;
        --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
          --grid: #2c2c2a; --axis: #383835; --tape: #4a4a46; --obstacle: #383835;
          --s1: #3987e5; --s2: #d95926; --s3: #199e70; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         fill: var(--ink2); font-size: 12px; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .strong { fill: var(--ink); font-weight: 600; }
  .muted { fill: var(--muted); font-size: 11px; }
</style>
<rect width="760" height="400" rx="8" fill="var(--surface)"/>
<text x="20" y="32" class="title">Control-step time on the chip: worst 425 µs of a 10,000 µs budget (4.25%)</text>
<text x="20" y="54">12,027 steps of the real firmware on simavr (ATmega328P, 16 MHz), all four tracks, timed by the debug pin.</text>
<rect x="20" y="74" width="720" height="14" rx="4" fill="var(--grid)"/>
<rect x="20" y="74" width="30.6" height="14" rx="4" fill="var(--s1)"/>
<text x="20" y="106">worst step, to scale</text>
<text x="740" y="106" text-anchor="end">10 ms control tick (100 Hz); the CPU sleeps for the rest</text>
<line x1="60" x2="740" y1="330.0" y2="330.0" stroke="var(--axis)" stroke-width="1"/>
<text x="52" y="334.0" text-anchor="end" class="muted">0</text>
